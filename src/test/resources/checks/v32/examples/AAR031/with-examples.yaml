asyncapi: 3.2.0
info:
  title: Message Examples
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: wss
channels:
  users:
    address: users
    messages:
      UserSignup:
        payload:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
        examples:
          - id: '123'
            email: user@example.com
