asyncapi: 3.2.0
info:
  title: Message Validation
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: wss
channels:
  orders:
    address: orders
    messages:
      Order:
        contentType: application/json
        payload:
          type: object
          properties:
            orderId:
              type: string
            amount:
              type: number
              minimum: 0
