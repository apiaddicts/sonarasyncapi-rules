asyncapi: "2.0.0"
info:
  title: Good API
  version: "1.0.0"
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
channels:
  /pets:
    subscribe:
      operationId: getPets
      message:
        contentType: application/json
        payload:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        examples:
          - payload:
              id: 1
              name: Fido
