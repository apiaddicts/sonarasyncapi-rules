asyncapi: '2.4.0'
info:
  title: Message Examples Avro Compliant
  version: '1.0.0'
servers:
  production:
    url: 'api.example.com'
    protocol: 'kafka'
channels:
  carga:
    subscribe:
      operationId: receiveCarga
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload:
          type: record
          name: CargaValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
            - name: importe
              type: double
        examples:
          - name: carga-example
            payload:
              id: '123'
              importe: 99.99
