asyncapi: '2.4.0'
info:
  title: Example API
  version: '1.0.0'
servers:
  production:
    url: 'broker.example.com:9092'
    protocol: kafka
    description: Kafka broker server
    bindings:
      kafka: # Noncompliant {{AAR037: Binding must specify a 'bindingVersion' field.}}
        clientId: example-client
channels:
  /noncompliant-topic:
    bindings:
      kafka: # Noncompliant {{AAR037: Binding must specify a 'bindingVersion' field.}}
        clientId: example-client
  /compliant-topic:
    bindings:
      kafka:
        clientId: example-client
        bindingVersion: '0.1.0'
    subscribe:
      operationId: consumeKafkaMessages
      bindings:
        kafka: # Noncompliant {{AAR037: Binding must specify a 'bindingVersion' field.}}
          clientId: example-client
      message:
        contentType: application/json
        bindings:
          kafka: # Noncompliant {{AAR037: Binding must specify a 'bindingVersion' field.}}
            contentType: application/json
        payload:
          type: object
          properties:
            id:
              type: integer
            event:
              type: string