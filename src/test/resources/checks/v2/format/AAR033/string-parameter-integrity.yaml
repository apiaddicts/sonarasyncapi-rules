asyncapi: '2.4.0'
info:
  title: String Parameter Restrictions Example API
  version: '1.0.0'
channels:
  /user-data:
    publish:
      operationId: sendUserData
      summary: Publish information about a user.
      message:
        contentType: application/json
        payload:
          type: object
          properties:
            username: # Noncompliant {{AAR033: String property should have at least one of: minLength, maxLength, pattern, enum, const, or format restriction.}}
              type: string
              description: User name.
            email:
              type: string
              pattern: '^[\w-\.]+@([\w-]+\.)+[\w-]{2,4}$'
            role:
              type: string
              enum:
                - admin
                - user
                - guest
            phoneNumber:
              type: string
              minLength: 10
              maxLength: 15
            countryCode:
              type: string
              format: iso-3166
            age:
              type: integer
