asyncapi: '2.4.0'
info:
  title: Message Title Avro Compliant
  version: '1.0.0'
servers:
  production:
    url: 'api.example.com'
    protocol: 'kafka'
channels:
  carga:
    subscribe:
      operationId: receiveCarga
      message:
        title: Carga Event
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload:
          type: record
          name: CargaValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
