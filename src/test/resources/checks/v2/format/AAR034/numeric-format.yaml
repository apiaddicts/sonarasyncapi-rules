asyncapi: '2.4.0'
info:
  version: '1.0.0'
  title: Numeric Format Example API
channels:
  /invoices:
    publish:
      operationId: publishInvoice
      summary: Publish invoice data.
      message:
        contentType: application/json
        payload:
          type: object
          properties:
            price:
              type: number
              format: double
            count:
              type: integer
              format: int32
            weight: # Noncompliant {{AAR034: Numeric property must specify a valid 'format' (int32, int64, float, double).}}
              type: number
              format: bad
            quantity:
              type: integer
            nested:
              type: object
              properties:
                ratio: # Noncompliant {{AAR034: Numeric property must specify a valid 'format' (int32, int64, float, double).}}
                  type: number
                  format: foo
