asyncapi: '2.4.0'
info:
  title: Valid OperationId Example API
  version: '1.0.0'
  description: API donde todos los operationId son camelCase.
channels:
  /pets:
    description: Canal para operaciones relacionadas con mascotas.
    subscribe:
      operationId: solicitarBeca
      summary: Operación para recibir la lista de mascotas.
      message:
        contentType: application/json
        payload:
          type: object
    publish:
      operationId: recuperarBeca
      summary: Operación para crear una nueva mascota.
      message:
        contentType: application/json
        payload:
          type: object
  /orders:
    description: Canal para operaciones relacionadas con pedidos.
    publish:
      operationId: processTopic2Topic3
      summary: Operación para procesar pedidos.
      message:
        contentType: application/json
        payload:
          type: object
  /invoices:
    description: Canal que ejercita los límites del patrón camelCase.
    publish:
      operationId: a
      summary: operationId de una sola letra minúscula.
      message:
        payload:
          type: object
    subscribe:
      operationId: procesarFacturaDeClienteConDescuentoAplicadoYRevisado
      summary: operationId camelCase largo.
      message:
        payload:
          type: object
  /payments:
    description: Canal para notificar pagos.
    publish:
      operationId: notificarPago
      summary: Operación para notificar un pago.
      message:
        payload:
          type: object
  x-internal-routing:
    description: Clave de extensión, no es un canal, no debe evaluarse.
    publish:
      summary: Operación sin operationId dentro de una extensión.
components:
  channels:
    /reservations:
      description: Canal reutilizable definido en components.
      subscribe:
        operationId: obtenerReserva
        summary: Operación para recibir reservas.
        message:
          payload:
            type: object
