asyncapi: '2.4.0'
info:
  title: Avro Name Nomenclature Invalid V2
  version: '1.0.0'
channels:
  orders:
    subscribe:
      operationId: receiveOrder
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR048: Avro name must start with a letter or underscore, and can only contain letters, numbers and underscores}}
          type: record
          name: 0-invalid-record
          namespace: org.example.orders
          fields:
            - name: id
              type: string
