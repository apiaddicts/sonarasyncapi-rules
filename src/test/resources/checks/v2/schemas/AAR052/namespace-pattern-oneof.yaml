asyncapi: '2.6.0'
info:
  title: Avro Namespace OneOf V2
  version: '1.0.0'
channels:
  orders:
    subscribe:
      operationId: receiveOrder
      message:
        oneOf:
          - schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
            payload: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
              type: record
              name: OrderA
              namespace: org.example.a
              fields:
                - name: id
                  type: string
          - schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
            payload:
              type: record
              name: OrderB
              namespace: org.madrid.p001.cmd.orders
              fields:
                - name: id
                  type: string
