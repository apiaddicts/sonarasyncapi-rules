asyncapi: '2.4.0'
info:
  title: Avro Namespace Pattern Valid Common V2
  version: '1.0.0'
channels:
  orders:
    subscribe:
      operationId: receiveOrder
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload:
          type: record
          name: OrderValue
          namespace: org.madrid.common.orders
          fields:
            - name: id
              type: string
