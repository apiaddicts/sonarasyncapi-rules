asyncapi: '2.4.0'
info:
  title: Avro Namespace Non String V2
  version: '1.0.0'
channels:
  ordersNumber:
    subscribe:
      operationId: receiveOrderNumber
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
          type: record
          name: OrderValue
          namespace: 123
          fields:
            - name: id
              type: string
  ordersBoolean:
    subscribe:
      operationId: receiveOrderBoolean
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
          type: record
          name: OrderValue
          namespace: true
          fields:
            - name: id
              type: string
  ordersObject:
    subscribe:
      operationId: receiveOrderObject
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
          type: record
          name: OrderValue
          namespace:
            nested: value
          fields:
            - name: id
              type: string
  ordersArray:
    subscribe:
      operationId: receiveOrderArray
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
          type: record
          name: OrderValue
          namespace:
            - org.madrid.p001.core.orders
          fields:
            - name: id
              type: string
