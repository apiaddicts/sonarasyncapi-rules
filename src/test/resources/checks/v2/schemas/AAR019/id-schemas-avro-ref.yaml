asyncapi: '2.4.0'
info:
  title: ID Schemas Avro With Ref
  version: '1.0.0'
servers:
  production:
    url: 'api.example.com'
    protocol: 'kafka'
channels:
  carga:
    subscribe:
      operationId: receiveCarga
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload:
          type: record
          name: CargaValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
            - name: datos
              type:
                $ref: '#/components/schemas/DatosRecord/schema'
components:
  schemas:
    DatosRecord:
      schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
      schema:
        type: record
        name: DatosRecord
        namespace: com.example.avro
        fields:
          - name: id
            type: string
          - name: nombre
            type: string
