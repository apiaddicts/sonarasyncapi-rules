asyncapi: '2.6.0'
info:
  title: Avro Schema Format Valid V2
  version: '1.0.0'
channels:
  carga:
    subscribe:
      operationId: receiveCarga
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload:
          type: record
          name: CargaValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
components:
  schemas:
    CargaComponent:
      schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
      type: record
      name: CargaComponent
      namespace: com.example.avro
      fields:
        - name: id
          type: string
