asyncapi: '2.6.0'
info:
  title: Avro Schema Format Wrong Format Variants V2
  version: '1.0.0'
channels:
  whitespace:
    subscribe:
      message:
        schemaFormat: 'application/vnd.apache.avro; version=1.9.0' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro; version=1.9.0' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: WhitespaceValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
  extraParam:
    subscribe:
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0;compression=snappy' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro;version=1.9.0;compression=snappy' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: ExtraParamValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
  charset:
    subscribe:
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0;charset=utf-8' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro;version=1.9.0;charset=utf-8' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: CharsetValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
  snapshot:
    subscribe:
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0-SNAPSHOT' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro;version=1.9.0-SNAPSHOT' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: SnapshotValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
  doubleZero:
    subscribe:
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.00' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro;version=1.9.00' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: DoubleZeroValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
