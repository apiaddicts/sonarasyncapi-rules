asyncapi: '2.6.0'
info:
  title: Avro Schema Format Wrong Version V2
  version: '1.0.0'
channels:
  carga:
    subscribe:
      operationId: receiveCarga
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.8.0' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro;version=1.8.0' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
        payload:
          type: record
          name: CargaValue
          namespace: com.example.avro
          fields:
            - name: id
              type: string
components:
  schemas:
    CargaComponent:
      schemaFormat: 'application/vnd.apache.avro' # Noncompliant {{AAR056: The 'schemaFormat' value 'application/vnd.apache.avro' must be exactly 'application/vnd.apache.avro;version=1.9.0' when the payload uses Avro}}
      type: record
      name: CargaComponent
      namespace: com.example.avro
      fields:
        - name: id
          type: string
