asyncapi: '2.6.0'
info:
  title: Components OneOf Partial
  version: '1.0.0'
servers:
  production:
    url: 'api.example.com'
    protocol: 'wss'
channels:
  orders:
    subscribe:
      operationId: receiveOrder
      message:
        $ref: '#/components/messages/OrderCreated'
components:
  messages:
    OrderCreated:
      oneOf:
        - contentType: application/json
          payload:
            type: object
        - payload: # Noncompliant {{AAR024: Each message must declare a 'contentType' unless it is an Avro message}}
            type: object
