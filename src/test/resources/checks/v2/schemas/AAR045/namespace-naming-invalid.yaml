asyncapi: '2.4.0'
info:
  title: Avro Namespace Naming Invalid V2
  version: '1.0.0'
channels:
  orders:
    subscribe:
      operationId: receiveOrder
      message:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        payload: # Noncompliant {{AAR045: Avro namespace must be lowercase and separated by dots}}
          type: record
          name: OrderValue
          namespace: Org.Example.Orders
          fields:
            - name: id
              type: string
