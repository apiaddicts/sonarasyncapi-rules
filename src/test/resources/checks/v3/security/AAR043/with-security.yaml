asyncapi: 3.0.0
info:
  title: Secure Channel
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: wss
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
channels:
  secure-events:
    address: secure/events
    messages:
      Event:
        payload: {type: object}
