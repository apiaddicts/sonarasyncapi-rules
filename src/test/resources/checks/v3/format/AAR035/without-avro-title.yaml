asyncapi: 3.0.0
info:
  title: Message Title Avro V3 Missing
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: kafka
channels:
  carga:
    address: carga
    messages:
      CargaMessage: # Noncompliant {{AAR035: It is recommended to have a title per message}}
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: record
            name: CargaValue
            namespace: com.example.avro
            fields:
              - name: id
                type: string
