        name: "" # Noncompliant {{AAR059: Avro record name must be in CamelCase with an uppercase first letter (e.g. SolicitudComunicacion, ResultadoComunicacionMail)}}
        fields:
          - name: id
            type: string
    SingleLetter:
      schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
