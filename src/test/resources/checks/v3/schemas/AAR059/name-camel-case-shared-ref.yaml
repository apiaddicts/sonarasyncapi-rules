asyncapi: 3.0.0
info:
  title: Avro Record Name CamelCase Shared Ref V3
  version: 1.0.0
channels:
  channelA:
    address: channel-a
    messages:
      inlineMessage:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: record
            name: inline_bad_name # Noncompliant {{AAR059: Avro record name must be in CamelCase with an uppercase first letter (e.g. SolicitudComunicacion, ResultadoComunicacionMail)}}
            fields:
              - name: id
                type: string
      sharedMessage:
        $ref: '#/components/messages/Shared'
  channelB:
    address: channel-b
    messages:
      sharedMessage:
        $ref: '#/components/messages/Shared'
components:
  messages:
    Shared:
      payload:
        schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
        schema:
          type: record
          name: shared_bad_name # Noncompliant {{AAR059: Avro record name must be in CamelCase with an uppercase first letter (e.g. SolicitudComunicacion, ResultadoComunicacionMail)}}
          fields:
            - name: id
              type: string
