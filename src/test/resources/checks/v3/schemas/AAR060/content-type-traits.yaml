asyncapi: 3.0.0
info:
  title: Content Type Avro Traits V3
  version: 1.0.0
channels:
  orders:
    address: orders
    messages:
      Order:
        traits:
          - contentType: application/json # Noncompliant {{AAR060: The contentType must match 'application/*+avro'}}
        payload:
          type: object
components:
