asyncapi: 3.0.0
info:
  title: Content Type Avro Missing On Avro Message V3
  version: 1.0.0
channels:
  orders:
    address: orders
    messages:
      OrderValue: # Noncompliant {{AAR060: An Avro message must declare a contentType matching 'application/*+avro'}}
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: record
            name: OrderValue
            namespace: org.madrid.p001.cmd.orders
            fields:
              - name: id
                type: string
      NotAvro:
        payload:
          type: object
