asyncapi: 3.0.0
info:
  title: Message Validation Avro V3
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: kafka
channels:
  carga:
    address: carga
    messages:
      CargaMessage:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: record
            name: CargaValue
            namespace: com.example.avro
            fields:
              - name: id
                type: string
