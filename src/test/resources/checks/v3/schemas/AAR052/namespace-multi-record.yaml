asyncapi: 3.0.0
info:
  title: Avro Namespace Multi Record V3
  version: 1.0.0
channels:
  orders:
    address: orders
    messages:
      OrderValidApp:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: record
            name: OrderValue
            namespace: org.madrid.p001.core.orders
            fields:
              - name: id
                type: string
      OrderInvalid:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
            type: record
            name: OrderValue
            namespace: org.example.orders
            fields:
              - name: id
                type: string
      StatusEnumValidCommon:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema:
            type: enum
            name: OrderStatus
            namespace: org.madrid.common.orders
            symbols:
              - NEW
              - SHIPPED
      HashFixedInvalid:
        payload:
          schemaFormat: 'application/vnd.apache.avro;version=1.9.0'
          schema: # Noncompliant {{AAR052: Avro namespace must follow the corporate pattern: org.madrid.<cod_poaps>.<classification>.<domain> for application schemas, or org.madrid.common.<domain> for common schemas}}
            type: fixed
            name: OrderHash
            namespace: org.example.hash
            size: 16
