asyncapi: 3.0.0
info:
  title: Subscribe Group Required - Valid V3
  version: 1.0.0
channels:
  alta-beca:
    address: alta.beca
  baja-beca:
    address: baja.beca
  salida-beca:
    address: salida.beca
operations:
  consumeAlta:
    action: receive
    channel:
      $ref: '#/channels/alta-beca'
    x-scs-group: alta.beca.1
  consumeBaja:
    action: receive
    channel:
      $ref: '#/channels/baja-beca'
    bindings:
      kafka:
        groupId:
          type: string
          enum: ['baja.beca.1']
  produceSalida:
    action: send
    channel:
      $ref: '#/channels/salida-beca'
