asyncapi: 3.0.0
info:
  title: Subscribe Group Required - Skip Cases V3
  version: 1.0.0
channels:
  alta-beca:
    address: alta.beca
operations:
  # An operation that is itself a $ref has no action and is skipped: the group
  # is validated at the reference target.
  refOperation:
    $ref: '#/components/operations/sharedConsumer'
  # Null operation value: skipped.
  brokenOperation: null
  # Operation without an action: skipped (not a consuming operation).
  noAction:
    channel:
      $ref: '#/channels/alta-beca'
  # Producer operation: ignored.
  produceSalida:
    action: send
    channel:
      $ref: '#/channels/alta-beca'
  # Consuming operation with a scalar kafka groupId: valid.
  consumeScalar:
    action: receive
    channel:
      $ref: '#/channels/alta-beca'
    bindings:
      kafka:
        groupId: alta.beca.1
components:
  operations:
    sharedConsumer:
      action: receive
      channel:
        $ref: '#/channels/alta-beca'
      x-scs-group: alta.beca.1
