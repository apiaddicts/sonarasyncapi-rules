asyncapi: 3.1.0
info:
  title: Message Schemas
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: wss
channels:
  events:
    address: events
    messages:
      Event:
        $ref: '#/components/messages/Event'
components:
  messages:
    Event:
      contentType: application/json
      payload:
        type: object
        properties:
          id:
            type: string
          timestamp:
            type: string
            format: date-time
