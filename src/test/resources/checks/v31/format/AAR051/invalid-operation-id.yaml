asyncapi: 3.1.0
info:
  title: Invalid Operation IDs
  version: 1.0.0
servers:
  - host: api.example.com
    protocol: wss
channels:
  messages:
    address: messages
    messages:
      Message:
        payload: {type: object}
operations:
  SendMessage: # Noncompliant {{AAR051: The operationId must be present and follow camelCase naming convention}}
    action: send
    channel: messages
  ReceiveMessage:
    action: receive
    channel: messages
    operationId: on_message_received # Noncompliant {{AAR051: The operationId must be present and follow camelCase naming convention}}
  NullOperationId:
    action: send
    channel: messages
    operationId: null # Noncompliant {{AAR051: The operationId must be present and follow camelCase naming convention}}
  NonStringOperationId:
    action: send
    channel: messages
    operationId: 12345 # Noncompliant {{AAR051: The operationId must be present and follow camelCase naming convention}}
  EmptyStringOperationId:
    action: send
    channel: messages
    operationId: "" # Noncompliant {{AAR051: The operationId must be present and follow camelCase naming convention}}
